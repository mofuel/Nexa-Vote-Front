name: Cypress Tests

on:
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout rama Pruebas
        uses: actions/checkout@v4
        with:
          ref: Pruebas

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Cypress con reporte JSON
        run: |
          npx cypress run \
          --reporter json \
          --reporter-options output=results.json
        env:
          CYPRESS_BASE_URL: https://nexa-vote-front.onrender.com

      - name: Verificar reporte generado
        run: ls -la

      - name: Subir reporte JSON
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report
          path: results.json
          retention-days: 7
